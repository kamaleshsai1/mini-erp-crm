services:
  # 1. Backend REST API
  - type: web
    name: mini-erp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=./prisma/schema.postgresql.prisma && npx prisma db push --schema=./prisma/schema.postgresql.prisma && npx tsx ./prisma/seed.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'

  # 2. Frontend Static Web App
  - type: web
    name: mini-erp-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mini-erp-backend-m2hi.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Free PostgreSQL 15 Database on Render
  - name: mini-erp-db
    plan: free
    databaseName: mini_erp_db
    user: erp_admin
