version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mini-erp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mini_erp_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-erp-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mini_erp_db?schema=public
      JWT_SECRET: super-secret-jwt-token-mini-erp-crm-2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini-erp-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
